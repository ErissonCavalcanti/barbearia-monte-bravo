<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Ícone Monte Bravo: anel e montanhas do logótipo, simplificados para tamanhos pequenos -->
  <rect width="64" height="64" rx="14" fill="#0b0b0b"/>
  <circle cx="32" cy="32" r="24" fill="none" stroke="#ffffff" stroke-width="3.6"/>
  <!-- montanha principal e secundária -->
  <path d="M11.5 42.5 L27 17.5 L33 27 L38 21 L52.5 42.5 Z" fill="#ffffff"/>
  <!-- sombra no pico principal (como no logótipo) -->
  <path d="M27 17.5 L22.6 24.6 L26.5 23 L29.6 25.9 Z" fill="#0b0b0b"/>
  <!-- linha dourada da base -->
  <rect x="17" y="46" width="30" height="3" rx="1.5" fill="#c9a24b"/>
</svg>
